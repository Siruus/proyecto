<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Online</title>
    <!-- Aquí conectamos el archivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Encabezado de la página -->
    <header>
        <div class="logo">Mi Tienda</div>
        <div class="carrito">
            🛒 Carrito (<span id="contador-carrito">0</span>)
        </div>
    </header>

    <!-- Contenedor principal de los productos -->
    <main>
        <h2>Nuestros Productos</h2>
        <div class="grid-productos">
            <!-- Producto de ejemplo 1 -->
            <div class="tarjeta-producto">
                <img src="https://via.placeholder.com/150" alt="Producto 1">
                <h3>Producto de Ejemplo</h3>
                <p class="precio">$19.99</p>
                <button class="btn-agregar">Agregar al carrito</button>
            </div>
        </div>
    </main>
</body>
</html>
